[build]
  command = "npm run build"
  publish = "dist"

# Production API Reverse Proxy (Proxy /api/* to external hosted backend on Render/Railway)
# NOTE: On Netlify, specific /api/* proxy rules MUST appear BEFORE the /* catch-all rule!
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-bhusetu-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
